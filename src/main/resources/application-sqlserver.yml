# Profil SQL Server : --spring.profiles.active=dev,sqlserver
spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=easypharma_db;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${MSSQL_SA_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/sqlserver
    baseline-on-migrate: false
