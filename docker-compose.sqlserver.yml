# SQL Server 2022 pour le profil Spring "sqlserver" (voir application-sqlserver.yml)
# Usage : docker compose -f docker-compose.sqlserver.yml up -d
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: easypharma-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?définir MSSQL_SA_PASSWORD dans .env}
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mssqldata:
