# Intervalles courts pour un laboratoire (détection rapide) ; en production : 15 s à 30 s.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

# Les alertes passent par Alertmanager, qui les notifie (voir alertmanager/alertmanager.yml).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Copie longue durée de toutes les séries vers VictoriaMetrics (Prometheus ne garde que 2 jours).
remote_write:
  - url: http://victoria-metrics:8428/api/v1/write

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: victoria-metrics
    static_configs:
      - targets: ["victoria-metrics:8428"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
