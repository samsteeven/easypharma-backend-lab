name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      # Build + tests (profil test). Docker est disponible sur le runner pour Testcontainers.
      - name: Build with tests
        run: ./mvnw clean verify -Dmaven.javadoc.skip=true
        env:
          SPRING_PROFILES_ACTIVE: test
          MAVEN_OPTS: "-Xmx1024m"

      - name: Verify JAR
        run: ls -la target/*.jar
